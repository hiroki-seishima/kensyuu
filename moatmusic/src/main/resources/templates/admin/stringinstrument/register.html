<!DOCTYPE ht<ml>  <!--楽器登録ページ-->
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragment :: meta}"></div>

    <div th:replace="~{fragment :: styles}"></div>

    <title>楽器登録</title>
</head>

<body>
    <div class="moatmusic-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 moatmusic-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/admin/stringInstrument}">楽器一覧</a></li>
                                <li class="breadcrumb-item active" aria-current="page">楽器登録</li>
                            </ol>
                        </nav>

                        <h1 class="mb-4 text-center">楽器登録</h1>

                        <form method="post" th:action="@{/admin/stringInstrument/create}" th:object="${stringInstrumentRegisterForm}" enctype="multipart/form-data">
                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="name" class="col-form-label text-md-left fw-bold">楽器名</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger small mb-2" th:errors="*{name}"></div>
                                    <input type="text" class="form-control" th:field="*{name}" autofocus>
                                </div>
                            </div>

                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="imageFile" class="col-form-label text-md-left fw-bold">楽器画像</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('imageFile')}" class="text-danger small mb-2" th:errors="*{imageFile}"></div>
                                    <input type="file" class="form-control" th:field="*{imageFile}">
                                </div>
                            </div>

                            <!-- 選択された画像の表示場所 -->
                            <div class="row" id="imagePreview"></div>

                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="description" class="col-form-label text-md-left fw-bold">説明</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('description')}" class="text-danger small mb-2" th:errors="*{description}"></div>
                                    <textarea class="form-control" th:field="*{description}" cols="30" rows="5"></textarea>
                                </div>
                            </div>

                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="price" class="col-form-label text-md-left fw-bold">レンタル料金（単位：円）</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('price')}" class="text-danger small mb-2" th:errors="*{price}"></div>
                                    <input type="number" class="form-control" th:field="*{price}">
                                </div>
                            </div>

                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="capacity" class="col-form-label text-md-left fw-bold">最大貸出数（単位：台）</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('capacity')}" class="text-danger small mb-2" th:errors="*{capacity}"></div>
                                    <input type="number" class="form-control" th:field="*{capacity}">
                                </div>
                            </div>

                            <div class="form-group row mb-3">
                                <div class="col-md-4">
                                    <label for="handedness" class="col-form-label text-md-left fw-bold">利き手</label>
                                </div>
                                <div class="col-md-8">
                                    <div th:if="${#fields.hasErrors('handedness')}" class="text-danger small mb-2" th:errors="*{handedness}"></div>
                                    <input type="text" class="form-control" th:field="*{handedness}">
                                </div>
                            </div>

                            <div class="form-group d-flex justify-content-center my-4">
                                <button type="submit" class="btn text-white shadow-sm w-50 moatmusic-btn">登録</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
    <script th:src="@{/js/preview.js}"></script>
</body>

</html>
